name: Mock Failure Deployment CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate Docker build
        run: |
          echo "Building Docker image..."
          echo "Docker image built successfully."

      - name: Simulate Docker push
        run: |
          echo "Pushing image to DockerHub..."
          echo "Image pushed successfully."

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run deployment command
        run: |
          echo "Connecting to development server..."
          echo "Running deployment commands..."
          echo "Changing to deployment directory..."
          echo "bash: cd: /home/azad/projects/zecommerz-dev/zecommerz-dev-server: No such file or directory"
          echo "Error: no configuration file provided: not found"
          echo "Docker Compose deployment failed."
          exit 1

  discord:
    name: Discord Notifications
    runs-on: ubuntu-latest
    needs: deployment
    if: always()

    steps:
      - name: Simulate deployment failure notification
        if: needs.deployment.result == 'failure'
        run: |
          echo "Development deployment failed!"
          echo "Notification would be sent to Discord."
